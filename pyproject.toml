[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiferet-stocks"
dynamic = ["version"]
description = "Provider-neutral symbols, quotes, daily history and watchlists for the Tiferet framework"
authors = [
    { name = "Andrew Shatz, Great Strength Systems", email = "andrew@greatstrength.me" }
]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tiferet>=2.2,<2.3",
]

[project.urls]
Homepage = "https://github.com/greatstrength/tiferet-stocks"
Repository = "https://github.com/greatstrength/tiferet-stocks"

[project.optional-dependencies]
test = [
    "pytest>=8.3.3",
]

[tool.setuptools.dynamic]
version = { attr = "tiferet_stocks.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["tiferet_stocks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
