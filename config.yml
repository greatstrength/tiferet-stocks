sessions:
  stocks_client:
    name: Stocks Client
    description: Reference client session for tiferet-stocks features.

services:
  watchlist_service:
    module_path: tiferet_stocks.repos.watchlist
    class_name: WatchlistConfigRepository
    params:
      watchlist_config: data/watchlists.yml
  symbol_lookup_service:
    module_path: tiferet_stocks.repos.yahoo
    class_name: YahooChartPriceRepository
    params:
      timeout: '10'
      retries: '1'
  # Swap providers by changing this entry; YahooChartPriceRepository also backs symbol_lookup_service, so change both together.
  # price_service must stay listed before get_quotes_event and get_history_event, or the feature step fails to load (DI order).
  price_service:
    module_path: tiferet_stocks.repos.yahoo
    class_name: YahooChartPriceRepository
    params:
      timeout: '10'
      retries: '1'
  get_symbol_event:
    module_path: tiferet_stocks.events.symbol
    class_name: GetSymbol
  resolve_symbols_event:
    module_path: tiferet_stocks.events.symbol
    class_name: ResolveSymbols
  list_exchanges_event:
    module_path: tiferet_stocks.events.symbol
    class_name: ListExchanges
  get_quotes_event:
    module_path: tiferet_stocks.events.quote
    class_name: GetQuotes
  get_history_event:
    module_path: tiferet_stocks.events.history
    class_name: GetHistory

  get_watchlist_event:
    module_path: tiferet_stocks.events.watchlist
    class_name: GetWatchlist
  list_watchlists_event:
    module_path: tiferet_stocks.events.watchlist
    class_name: ListWatchlists
  create_watchlist_event:
    module_path: tiferet_stocks.events.watchlist
    class_name: CreateWatchlist
  update_watchlist_event:
    module_path: tiferet_stocks.events.watchlist
    class_name: UpdateWatchlist
  delete_watchlist_event:
    module_path: tiferet_stocks.events.watchlist
    class_name: DeleteWatchlist
  add_watchlist_symbol_event:
    module_path: tiferet_stocks.events.watchlist
    class_name: AddWatchlistSymbol
  remove_watchlist_symbol_event:
    module_path: tiferet_stocks.events.watchlist
    class_name: RemoveWatchlistSymbol
  move_watchlist_symbol_event:
    module_path: tiferet_stocks.events.watchlist
    class_name: MoveWatchlistSymbol

features:
  watchlists:
    get:
      name: GetWatchlist
      description: GetWatchlist through the watchlist service
      steps:
        - service_id: get_watchlist_event
          name: GetWatchlist
    list:
      name: ListWatchlists
      description: ListWatchlists through the watchlist service
      steps:
        - service_id: list_watchlists_event
          name: ListWatchlists
    create:
      name: CreateWatchlist
      description: CreateWatchlist through the watchlist service
      steps:
        - service_id: create_watchlist_event
          name: CreateWatchlist
    update:
      name: UpdateWatchlist
      description: UpdateWatchlist through the watchlist service
      steps:
        - service_id: update_watchlist_event
          name: UpdateWatchlist
    delete:
      name: DeleteWatchlist
      description: DeleteWatchlist through the watchlist service
      steps:
        - service_id: delete_watchlist_event
          name: DeleteWatchlist
    add:
      name: AddWatchlistSymbol
      description: AddWatchlistSymbol through the watchlist service
      steps:
        - service_id: add_watchlist_symbol_event
          name: AddWatchlistSymbol
    remove:
      name: RemoveWatchlistSymbol
      description: RemoveWatchlistSymbol through the watchlist service
      steps:
        - service_id: remove_watchlist_symbol_event
          name: RemoveWatchlistSymbol
    move:
      name: MoveWatchlistSymbol
      description: MoveWatchlistSymbol through the watchlist service
      steps:
        - service_id: move_watchlist_symbol_event
          name: MoveWatchlistSymbol
  quotes:
    get:
      name: Get Quotes
      description: Gets the latest quote for each requested symbol; partial failures are returned as data
      steps:
        - service_id: get_quotes_event
          name: Get the quotes
    history:
      name: Get History
      description: Gets the daily bars for one symbol between two ISO dates, inclusive, oldest first
      params_schema:
        symbol: str
        start: str
        end: str
      steps:
        - service_id: get_history_event
          name: Get the history
  symbols:
    get:
      name: Get Symbol
      description: Looks up one symbol and checks it against an optional expected exchange
      params_schema:
        id: str
        exchange:
          type: str
          required: false
      steps:
        - service_id: get_symbol_event
          name: Look up the symbol
    resolve:
      name: Resolve Symbols
      description: Looks up many symbols and reports mismatches and unresolved ids as failures
      steps:
        - service_id: resolve_symbols_event
          name: Resolve the symbols
  exchanges:
    list:
      name: List Exchanges
      description: Lists the exchange ids the domain recognizes
      steps:
        - service_id: list_exchanges_event
          name: List the exchanges

errors:
  QUOTES_UNAVAILABLE:
    name: Quotes Unavailable
    message:
      - lang: en_US
        text: 'No quotes are available for the requested symbols: {symbols}.'
  WATCHLIST_NOT_FOUND:
    name: Watchlist Not Found
    message:
      - lang: en_US
        text: 'Watchlist not found: {id}.'
  WATCHLIST_EXISTS:
    name: Watchlist Exists
    message:
      - lang: en_US
        text: 'Watchlist already exists: {id}.'
  WATCHLIST_SYMBOL_EXISTS:
    name: Watchlist Symbol Exists
    message:
      - lang: en_US
        text: 'Symbol already exists in watchlist {id}: {symbol_id}.'
  WATCHLIST_SYMBOL_NOT_FOUND:
    name: Watchlist Symbol Not Found
    message:
      - lang: en_US
        text: 'Symbol not found in watchlist {id}: {symbol_id}.'
  WATCHLIST_INDEX_OUT_OF_RANGE:
    name: Watchlist Index Out Of Range
    message:
      - lang: en_US
        text: 'Watchlist index must be -1 or greater: {index}.'
  HISTORY_UNAVAILABLE:
    name: History Unavailable
    message:
      - lang: en_US
        text: 'No price history is available for {symbol}: {reason}.'
  INVALID_HISTORY_RANGE:
    name: Invalid History Range
    message:
      - lang: en_US
        text: 'The history range {start} to {end} is invalid: {detail}.'

cli:
  cmds:
    quotes:
      get:
        group_key: quotes
        key: get
        name: Quotes Get
        description: Run the quotes.get feature.
        args:
          - name_or_flags:
              - symbols
            description: One or more symbol tickers.
            type: list
            nargs: '+'
      history:
        group_key: quotes
        key: history
        name: Quotes History
        description: Run the quotes.history feature.
        args:
          - name_or_flags:
              - symbol
            description: The symbol ticker.
            type: str
          - name_or_flags:
              - --start
            description: The first inclusive ISO date.
            type: str
            required: true
          - name_or_flags:
              - --end
            description: The last inclusive ISO date.
            type: str
            required: true
    symbols:
      get:
        group_key: symbols
        key: get
        name: Symbols Get
        description: Run the symbols.get feature.
        args:
          - name_or_flags:
              - symbol
            description: The symbol ticker.
            type: str
      resolve:
        group_key: symbols
        key: resolve
        name: Symbols Resolve
        description: Run the symbols.resolve feature.
        args:
          - name_or_flags:
              - symbols
            description: One or more symbol tickers.
            type: list
            nargs: '+'
          - name_or_flags:
              - --expected-exchanges
            description: Expected exchanges as SYM=EXCHANGE tokens.
            type: dict
            nargs: '+'
    exchanges:
      list:
        group_key: exchanges
        key: list
        name: Exchanges List
        description: Run the exchanges.list feature.
    watchlists:
      list:
        group_key: watchlists
        key: list
        name: Watchlists List
        description: Run the watchlists.list feature.
      get:
        group_key: watchlists
        key: get
        name: Watchlists Get
        description: Run the watchlists.get feature.
        args:
          - name_or_flags:
              - id
            description: The watchlist id.
            type: str
      create:
        group_key: watchlists
        key: create
        name: Watchlists Create
        description: Run the watchlists.create feature.
        args:
          - name_or_flags:
              - id
            description: The new watchlist id.
            type: str
          - name_or_flags:
              - --name
            description: The display name.
            type: str
            required: true
          - name_or_flags:
              - --description
            description: The optional description.
            type: str
          - name_or_flags:
              - --symbol-ids
            description: The initial ordered tickers.
            type: list
            nargs: '+'
      update:
        group_key: watchlists
        key: update
        name: Watchlists Update
        description: Run the watchlists.update feature.
        args:
          - name_or_flags:
              - id
            description: The existing watchlist id.
            type: str
          - name_or_flags:
              - --name
            description: The new display name.
            type: str
          - name_or_flags:
              - --description
            description: The new description.
            type: str
      delete:
        group_key: watchlists
        key: delete
        name: Watchlists Delete
        description: Run the watchlists.delete feature.
        args:
          - name_or_flags:
              - id
            description: The watchlist id.
            type: str
      add:
        group_key: watchlists
        key: add
        name: Watchlists Add
        description: Run the watchlists.add feature.
        args:
          - name_or_flags:
              - id
            description: The watchlist id.
            type: str
          - name_or_flags:
              - symbol_id
            description: The ticker to add.
            type: str
          - name_or_flags:
              - --index
            description: The zero-based insertion position or -1 for the end.
            type: int
            default: '-1'
      remove:
        group_key: watchlists
        key: remove
        name: Watchlists Remove
        description: Run the watchlists.remove feature.
        args:
          - name_or_flags:
              - id
            description: The watchlist id.
            type: str
          - name_or_flags:
              - symbol_id
            description: The ticker to remove.
            type: str
      move:
        group_key: watchlists
        key: move
        name: Watchlists Move
        description: Run the watchlists.move feature.
        args:
          - name_or_flags:
              - id
            description: The watchlist id.
            type: str
          - name_or_flags:
              - symbol_id
            description: The ticker to move.
            type: str
          - name_or_flags:
              - --to-index
            description: The final zero-based position or -1 for the end.
            type: int
            default: '-1'
